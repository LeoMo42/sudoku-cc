<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="64" fill="#7c3aed"/>
  <g transform="translate(56,56)" stroke="#fff" stroke-width="6" fill="none">
    <!-- Outer border -->
    <rect width="400" height="400" rx="8" stroke-width="10"/>
    <!-- Box dividers -->
    <line x1="133" y1="0" x2="133" y2="400" stroke-width="8"/>
    <line x1="267" y1="0" x2="267" y2="400" stroke-width="8"/>
    <line x1="0" y1="133" x2="400" y2="133" stroke-width="8"/>
    <line x1="0" y1="267" x2="400" y2="267" stroke-width="8"/>
    <!-- Cell dividers -->
    <line x1="44" y1="0" x2="44" y2="400" stroke-width="2" opacity="0.4"/>
    <line x1="89" y1="0" x2="89" y2="400" stroke-width="2" opacity="0.4"/>
    <line x1="178" y1="0" x2="178" y2="400" stroke-width="2" opacity="0.4"/>
    <line x1="222" y1="0" x2="222" y2="400" stroke-width="2" opacity="0.4"/>
    <line x1="311" y1="0" x2="311" y2="400" stroke-width="2" opacity="0.4"/>
    <line x1="356" y1="0" x2="356" y2="400" stroke-width="2" opacity="0.4"/>
    <line x1="0" y1="44" x2="400" y2="44" stroke-width="2" opacity="0.4"/>
    <line x1="0" y1="89" x2="400" y2="89" stroke-width="2" opacity="0.4"/>
    <line x1="0" y1="178" x2="400" y2="178" stroke-width="2" opacity="0.4"/>
    <line x1="0" y1="222" x2="400" y2="222" stroke-width="2" opacity="0.4"/>
    <line x1="0" y1="311" x2="400" y2="311" stroke-width="2" opacity="0.4"/>
    <line x1="0" y1="356" x2="400" y2="356" stroke-width="2" opacity="0.4"/>
  </g>
  <!-- Sample digits — centered in grid cells (cell size ~44.4px, grid starts at 56,56) -->
  <g fill="#fff" font-family="system-ui,sans-serif" font-weight="700" font-size="30" text-anchor="middle" dominant-baseline="central">
    <text x="78" y="78">5</text>
    <text x="256" y="78">8</text>
    <text x="434" y="78">1</text>
    <text x="167" y="122">6</text>
    <text x="345" y="122">3</text>
    <text x="122" y="167">2</text>
    <text x="300" y="167">9</text>
    <text x="211" y="211">4</text>
    <text x="389" y="211">7</text>
  </g>
</svg>
