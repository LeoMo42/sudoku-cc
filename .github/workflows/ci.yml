name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# Least-privilege token (#228). CI only checks out the repo and runs
# build/lint/test/e2e — none of which need to write to GitHub. The
# default GITHUB_TOKEN scope depends on the repo setting, which can
# silently widen if anyone flips the org/repo default to write. Pin
# this workflow to read-only so the blast radius can't grow under us.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run unit tests
        run: |
          # vitest runs every test, then hangs before printing its summary
          # (jsdom/esbuild cleanup). So the run legitimately ends in `timeout`
          # exit 124 with no summary line, and the gate has to decide pass/fail
          # from the per-test lines instead.
          #
          # Two bugs made the old version of this unable to fail at all (#287):
          #   1. CODE=$? after a pipeline captures `tee`, not vitest. Without
          #      pipefail (GitHub's default shell is `bash -e {0}`) it was
          #      always 0, so the first branch exited 0 unconditionally.
          #   2. The exit-124 branch guarded on `grep -qE '[1-9][0-9]* tests?'`,
          #      but the hung run never prints a "N tests" summary, so that
          #      guard could never have matched even if it had been reached.
          set +e
          timeout 300 npx vitest run --config vitest.unit.config.ts --reporter=verbose 2>&1 | tee vitest.log
          CODE=${PIPESTATUS[0]}
          set -e

          PASSED=$(grep -cE '^[[:space:]]*✓ ' vitest.log || true)
          FAILED=$(grep -cE '^[[:space:]]*(FAIL|×) ' vitest.log || true)
          echo "vitest: ${PASSED} passed, ${FAILED} failed, exit ${CODE}"

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::${FAILED} test(s) failed."
            exit 1
          fi

          # Fail CLOSED on a truncated run. Without this, a suite that outgrows
          # the timeout gets killed partway and still looks clean, because no
          # failure has been printed yet. Bump the floor when tests are added;
          # lower it deliberately if tests are removed.
          MIN_TESTS=480
          if [ "$PASSED" -lt "$MIN_TESTS" ]; then
            echo "::error::Only ${PASSED} tests ran, expected at least ${MIN_TESTS}. Run was truncated."
            exit 1
          fi

          # 0 = clean exit. 124 = the known post-run hang, with every test
          # accounted for by the two checks above.
          if [ "$CODE" -eq 0 ] || [ "$CODE" -eq 124 ]; then
            exit 0
          fi
          exit $CODE

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  e2e:
    needs: build
    runs-on: ubuntu-latest
    # Per-matrix-instance cap. Median run is ~80s across browsers; the
    # slowest legit run on record is 566s (webkit, PR #252 — passing
    # but on a slow GHA runner). 10 min gives ~6× headroom over that
    # while killing genuine hangs in a third of the previous 30 min
    # cap. Bump back up only if a real test legitimately needs >10 min.
    timeout-minutes: 10
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser and system deps
        run: npx playwright install --with-deps ${{ matrix.browser }}
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - name: Install system deps only (browser cached)
        run: npx playwright install-deps ${{ matrix.browser }}
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - run: npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
