name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint .

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run unit tests
        run: |
          # vitest hangs after tests pass (jsdom/esbuild cleanup issue).
          # Pipe to tee so we capture output, then verify tests actually passed.
          set +e
          timeout 120 npx vitest run --config vitest.unit.config.ts --reporter=verbose 2>&1 | tee vitest.log
          CODE=$?
          set -e
          if [ $CODE -eq 0 ]; then exit 0; fi
          # timeout exit 124: check if tests ran with no failures
          if [ $CODE -eq 124 ] && grep -qE '✓.*tests' vitest.log && ! grep -qE '✗|FAIL|Error' vitest.log; then
            echo "Tests passed but vitest hung during cleanup (known jsdom issue). Exiting cleanly."
            exit 0
          fi
          exit $CODE

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build

  e2e:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
